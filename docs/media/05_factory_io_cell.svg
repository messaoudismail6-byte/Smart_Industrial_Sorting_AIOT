<rect x="1140" y="390" width="150" height="120" rx="14" fill="#382a2a"/><text x="1215" y="440" fill="white" font-size="22" text-anchor="middle">REJECT</text><text x="1215" y="475" fill="#e4b5b5" font-size="17" text-anchor="middle">&gt; 5 kg</text>
